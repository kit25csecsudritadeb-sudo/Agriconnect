<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Health - AgriConnect</title>
    <link rel="stylesheet" href="farmer_health.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <button class="back-button" id="backButton">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>Back</span>
            </button>
            <div class="header-title">
                <h1>Crop Health</h1>
            </div>
            <button class="refresh-button" id="refreshButton">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Loading State -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
        </div>
        <p class="loading-text">Loading crop health data...</p>
    </div>

    <!-- Error State -->
    <div class="error-container" id="errorContainer" style="display: none;">
        <div class="error-content">
            <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <h2>Unable to load data</h2>
            <p id="errorMessage">Something went wrong. Please try again.</p>
            <button class="retry-button" id="retryButton">Retry</button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent" style="display: none;">
        
        <!-- Overall Status Card -->
        <section class="status-hero">
            <div class="status-card">
                <div class="status-icon-container" id="statusIconContainer">
                    <svg class="status-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="8" fill="none" opacity="0.2"/>
                        <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="8" fill="none" 
                                stroke-dasharray="282.7" stroke-dashoffset="70.7" 
                                transform="rotate(-90 50 50)" class="status-progress"/>
                        <text x="50" y="58" text-anchor="middle" font-size="24" font-weight="bold" fill="currentColor">
                            <tspan id="statusPercentage">75%</tspan>
                        </text>
                    </svg>
                </div>
                <div class="status-content">
                    <h2 class="status-label">Overall Health Status</h2>
                    <p class="status-value" id="statusValue">Loading...</p>
                    <span class="status-badge" id="statusBadge">Analyzing</span>
                </div>
            </div>
            <div class="status-timestamp">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span id="lastUpdated">Last updated: Loading...</span>
            </div>
        </section>

        <!-- Farmer Insights -->
        <section class="insights-section">
            <div class="section-header">
                <h2 class="section-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                    </svg>
                    Key Insights
                </h2>
            </div>
            <div class="insight-card">
                <div class="insight-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <p class="insight-text" id="insightText">Loading insights...</p>
            </div>
        </section>

        <!-- Recommendations -->
        <section class="recommendations-section">
            <div class="section-header">
                <h2 class="section-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 11 12 14 22 4"/>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                    Recommended Actions
                </h2>
                <span class="recommendation-count" id="recommendationCount">0 actions</span>
            </div>
            <div class="recommendations-list" id="recommendationsList">
                <!-- Recommendations will be dynamically inserted here -->
            </div>
        </section>

        <!-- Health Indicators -->
        <section class="indicators-section">
            <div class="section-header">
                <h2 class="section-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="20" x2="12" y2="10"/>
                        <line x1="18" y1="20" x2="18" y2="4"/>
                        <line x1="6" y1="20" x2="6" y2="16"/>
                    </svg>
                    Health Indicators
                </h2>
            </div>
            <div class="indicators-grid" id="indicatorsGrid">
                <!-- Indicators will be dynamically inserted here -->
            </div>
        </section>

    </main>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip" style="display: none;">
        <div class="tooltip-content" id="tooltipContent"></div>
    </div>
    
    <script src="uav_flight_manager.js"></script>
    <script src="farmer_health.js"></script>
</body>
</html>
