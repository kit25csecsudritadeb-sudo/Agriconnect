<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Zones - AgriConnect</title>
    <link rel="stylesheet" href="farmer_zones.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <button class="back-button" id="backButton">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>Back</span>
            </button>
            <div class="header-title">
                <h1>Field Zones</h1>
            </div>
            <button class="refresh-button" id="refreshButton">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Loading State -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
        </div>
        <p class="loading-text">Loading field zone data...</p>
    </div>

    <!-- Error State -->
    <div class="error-container" id="errorContainer" style="display: none;">
        <div class="error-content">
            <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <h2>Unable to load data</h2>
            <p id="errorMessage">Something went wrong. Please try again.</p>
            <button class="retry-button" id="retryButton">Retry</button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent" style="display: none;">
        
        <!-- Field Overview -->
        <section class="field-overview">
            <div class="overview-card">
                <div class="overview-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <line x1="3" y1="9" x2="21" y2="9"/>
                        <line x1="9" y1="21" x2="9" y2="9"/>
                    </svg>
                </div>
                <div class="overview-content">
                    <h3>Total Zones</h3>
                    <p class="overview-value" id="totalZones">0</p>
                </div>
            </div>
            <div class="overview-card">
                <div class="overview-icon risk">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                </div>
                <div class="overview-content">
                    <h3>High Risk Zones</h3>
                    <p class="overview-value" id="riskZones">0</p>
                </div>
            </div>
            <div class="overview-card">
                <div class="overview-icon healthy">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
                <div class="overview-content">
                    <h3>Healthy Zones</h3>
                    <p class="overview-value" id="healthyZones">0</p>
                </div>
            </div>
        </section>

        <!-- Filter Bar -->
        <section class="filter-bar">
            <button class="filter-btn active" data-filter="all">
                All Zones
            </button>
            <button class="filter-btn" data-filter="high">
                <span class="risk-dot high"></span>
                High Risk
            </button>
            <button class="filter-btn" data-filter="medium">
                <span class="risk-dot medium"></span>
                Medium Risk
            </button>
            <button class="filter-btn" data-filter="low">
                <span class="risk-dot low"></span>
                Low Risk
            </button>
        </section>

        <!-- Zones Grid -->
        <section class="zones-section">
            <div class="zones-grid" id="zonesGrid">
                <!-- Zone cards will be dynamically inserted here -->
            </div>
        </section>

        <!-- Zone Details Modal -->
        <div class="modal" id="zoneModal" style="display: none;">
            <div class="modal-overlay" id="modalOverlay"></div>
            <div class="modal-content">
                <button class="modal-close" id="modalClose">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <div class="modal-body" id="modalBody">
                    <!-- Details will be inserted here -->
                </div>
            </div>
        </div>

    </main>

    <script src="farmer_zones.js"></script>
</body>
</html>
