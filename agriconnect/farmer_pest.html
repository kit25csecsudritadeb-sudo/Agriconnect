<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pest & Disease Risk - AgriConnect</title>
    <link rel="stylesheet" href="farmer_pest.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <button class="back-button" id="backButton">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>Back</span>
            </button>
            <div class="header-title">
                <h1>Pest & Disease Risk</h1>
            </div>
            <button class="refresh-button" id="refreshButton">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Loading State -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading pest data...</p>
    </div>

    <!-- Error State -->
    <div class="error-container" id="errorContainer" style="display: none;">
        <div class="error-content">
            <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <h2>Unable to load data</h2>
            <p id="errorMessage">Something went wrong. Please try again.</p>
            <button class="retry-button" id="retryButton">Retry</button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent" style="display: none;">
        
        <!-- Pest Detection Card -->
        <section class="card-section">
            <div class="section-header">
                <h2 class="section-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    Pest Detection Analysis
                </h2>
            </div>
            <div class="pest-card card-content">
                <div class="stat-row">
                    <span class="stat-label">Pest Type:</span>
                    <span class="stat-value" id="pestType">—</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Severity:</span>
                    <span class="severity-badge" id="pestSeverity">—</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Priority:</span>
                    <span class="priority-badge" id="pestPriority">—</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Severity Score:</span>
                    <span class="stat-value" id="pestScore">—</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Affected Zones:</span>
                    <span class="stat-value" id="pestZones">—</span>
                </div>
            </div>
        </section>

        <!-- Zone Risk Map -->
        <section class="card-section">
            <div class="section-header">
                <h2 class="section-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <line x1="9" y1="3" x2="9" y2="21"/>
                        <line x1="15" y1="3" x2="15" y2="21"/>
                        <line x1="3" y1="9" x2="21" y2="9"/>
                        <line x1="3" y1="15" x2="21" y2="15"/>
                    </svg>
                    Affected Zone Map
                </h2>
            </div>
            <div class="zone-card card-content">
                <div class="zone-list" id="zoneList"></div>
            </div>
        </section>

        <!-- Recommendations -->
        <section class="card-section">
            <div class="section-header">
                <h2 class="section-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Recommended Actions
                </h2>
            </div>
            <div class="recommendations-card card-content">
                <div class="recommendations-list" id="recommendationsList"></div>
            </div>
        </section>

    </main>
    <script src="uav_flight_manager.js"></script>
    <script src="farmer_pest.js"></script>
</body>
</html>
